let freshHomeStateApplied=false;
function kgSeoSlug(value){
  return String(value)
    .toLocaleLowerCase("tr-TR")
    .replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/\+/g," plus ")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function kgSeoStorage(value){
  const match=String(value||"").match(/^(\d+)(gb|tb|mm)$/);
  if(!match) return null;
  const amount=Number(match[1]);
  return match[2]==="tb" ? amount*1024 : amount;
}

function kgResolveSeoPath(pathname){
  const parts=String(pathname||"").replace(/^\/+|\/+$/g,"").split("/").filter(Boolean);
  if(!parts.length) return null;
  const categoryBySlug={telefon:"phone",tablet:"tablet",bilgisayar:"computer","akilli-saat":"watch","oyun-konsolu":"console"};
  const category=categoryBySlug[parts[0]];
  if(!category || parts.length>4) return null;
  const catalog=category==="phone" ? PHONE_CATALOG : STATIC_CATALOG[category];
  if(!catalog) return null;
  if(parts.length===1) return {category};
  const brand=Object.keys(catalog).find(name=>kgSeoSlug(name)===parts[1]);
  if(!brand) return null;
  if(parts.length===2) return {category,brand};
  const model=(catalog[brand]||[]).find(name=>kgSeoSlug(name)===parts[2]);
  if(!model) return null;
  if(parts.length===3) return {category,brand,model};
  const storage=kgSeoStorage(parts[3]);
  if(!Number.isFinite(storage)) return null;
  const storageMap=category==="phone"
    ? PHONE_STORAGE_OPTIONS_BY_BRAND[brand]?.[model]
    : category==="watch" ? WATCH_VARIANT_OPTIONS?.[brand]?.[model]
    : category==="computer" ? COMPUTER_STORAGE_OPTIONS?.[brand]?.[model]
    : category==="tablet" ? TABLET_STORAGE_OPTIONS?.[brand]?.[model]
    : CONSOLE_STORAGE_OPTIONS?.[model];
  if(!Array.isArray(storageMap)) return null;
  const matchedStorage=storageMap.map(Number).find(value=>
    value===storage || (storage===1024 && value===1000) || (storage===2048 && value===2000)
  );
  if(!Number.isFinite(matchedStorage)) return null;
  return {category,brand,model,storage:matchedStorage};
}

function kgUpdateSeoCanonical(){
  const route=kgResolveSeoPath(window.location.pathname);
  if(!route) return;
  const canonical="https://kacagider.com.tr"+window.location.pathname;
  document.querySelector('link[rel="canonical"]')?.setAttribute("href",canonical);
  document.querySelector('meta[property="og:url"]')?.setAttribute("content",canonical);
}

async function kgOpenSeoRoute(route){
  const card=document.querySelector('[data-category="'+route.category+'"]');
  if(!card) return;
  await selectCategory(route.category,card);
  if(route.category==="phone"){
    const brand=document.getElementById("phoneBrand");
    brand.value=route.brand;
    populatePhoneModels(route.model);
    if(route.model){
      document.getElementById("model").value=route.model;
      updatePhoneStorageOptions();
    }
    if(Number.isFinite(route.storage)) document.getElementById("storage").value=String(route.storage);
    return;
  }
  const brand=document.getElementById("genericBrand");
  brand.value=route.brand||"";
  if(route.brand) populateGenericModels();
  if(route.model){
    document.getElementById("genericModel").value=route.model;
    populateGenericStorage();
  }
  if(Number.isFinite(route.storage)) document.getElementById("genericStorage").value=String(route.storage);
}

function forceFreshHomeState(){
  if(freshHomeStateApplied) return;
  freshHomeStateApplied=true;
  const seoRoute=kgResolveSeoPath(window.location.pathname);
  if(seoRoute){
    kgUpdateSeoCanonical();
    void kgOpenSeoRoute(seoRoute);
    return;
  }
  resetValuationState();
  showView("home",document.getElementById("navHome"));

  try{
    var u=new URL(window.location.href);
    if(u.searchParams.has("__kgfresh")){
      u.searchParams.delete("__kgfresh");
      var clean=u.pathname + (u.search ? u.search : "") + (u.hash ? u.hash : "");
      window.history.replaceState(null,"",clean);
    }
  }catch(e){}
}

<script id="kg-theme-faq-contact-behavior">
(function(){
  const themeKey="kg-theme";
  const root=document.documentElement;
  const themeToggle=document.getElementById("themeToggle");
  const mobileNavToggle=document.getElementById("mobileNavToggle");
  const topbar=document.querySelector(".kg-approved-topbar");

  function applyTheme(theme){
    const dark=theme==="dark";
    if(dark) root.dataset.theme="dark";
    else delete root.dataset.theme;
    if(themeToggle){
      themeToggle.textContent=dark ? "☾" : "☼";
      themeToggle.setAttribute("aria-pressed",String(dark));
      themeToggle.setAttribute("aria-label",dark ? "Açık temaya geç" : "Koyu temaya geç");
    }
  }

  applyTheme(root.dataset.theme==="dark" ? "dark" : "light");

  if(themeToggle){
    themeToggle.addEventListener("click",function(){
      const next=root.dataset.theme==="dark" ? "light" : "dark";
      applyTheme(next);
      try{ localStorage.setItem(themeKey,next); }catch(e){}
    });
  }

  if(mobileNavToggle && topbar){
    const closeMobileNav=()=>{
      topbar.classList.remove("menu-open");
      mobileNavToggle.setAttribute("aria-expanded","false");
      mobileNavToggle.setAttribute("aria-label","Menüyü aç");
    };
    mobileNavToggle.addEventListener("click",function(){
      const open=topbar.classList.toggle("menu-open");
      mobileNavToggle.setAttribute("aria-expanded",String(open));
      mobileNavToggle.setAttribute("aria-label",open ? "Menüyü kapat" : "Menüyü aç");
    });
    document.querySelectorAll(".kg-main-nav a").forEach(link=>link.addEventListener("click",closeMobileNav));
  }

  document.querySelectorAll(".kg-faq-question").forEach(function(button){
    button.addEventListener("click",function(){
      const item=button.closest(".kg-faq-item");
      const open=!item.classList.contains("is-open");

      button.setAttribute("aria-expanded",String(open));

  const contactForm=document.getElementById("contactForm");

      const fields=[

        ["contactEmail","contactEmailError","Geçerli bir e-posta adresi girin."],
        ["contactSubject","contactSubjectError","Konu alanını doldurun."],

    "Tablet neden ısınır?":"Şarj, oyun, uzun video kullanımı veya sıcak ortam geçici ısınmaya yol açabilir. Aşırı ısınma devam ederse kullanımı bırakıp destek alın.",
    "Pil neden çabuk biter?":"Yüksek parlaklık, arka plan uygulamaları ve pilin yaşlanması tüketimi artırabilir. Pil kullanım ekranından gereksiz uygulamaları sınırlayın.",
    "Tablet şarj olmuyorsa ne yapılır?":"Uyumlu kablo ve adaptörü, şarj girişini ve prizi kontrol edin. Sorun sürerse port veya pil için teknik servis gerekebilir.",
    "Ekran dönmüyorsa ne yapılır?":"Hızlı ayarlardan ekran döndürme kilidinin kapalı olduğundan emin olun. Uygulama veya model desteği de ekranın yönünü etkileyebilir.",
    "Wi-Fi bağlantı sorunu nasıl çözülür?":"Wi-Fi'yi kapatıp açın, ağı unutup yeniden bağlanın ve modemi kontrol edin. Sorun devam ederse ağ ayarlarını sıfırlama seçeneğini dikkatle değerlendirin.",
    "Tablet satmadan önce ne yapılmalıdır?":"Verileri yedekleyin, hesaplardan çıkış yapın, cihaz bulma kilitlerini kaldırın ve fabrika ayarlarına dönün.",
    "Hesaplardan nasıl çıkış yapılır?":"Ayarlar içindeki hesaplar bölümünden bağlı hesapları seçip kaldırın. Menü adları işletim sistemi ve sürüme göre değişebilir.",
    "Pil sağlığı nasıl korunur?":"Cihazı aşırı sıcak ortamdan uzak tutun, uyumlu şarj ekipmanı kullanın ve uzun süre tamamen boş halde bırakmayın.",
    "Windows bilgisayar nasıl sıfırlanır?":"Ayarlar > Sistem > Kurtarma bölümünden Bu bilgisayarı sıfırla seçeneğini kullanın. Dosyaları koruma seçeneği olsa bile önce yedek alın.",
    "Mac nasıl sıfırlanır?":"macOS Kurtarma modundan Diski Silme ve macOS'i yeniden yükleme adımlarını kullanabilirsiniz. İşlem öncesi Time Machine veya başka bir yedek alın.",
    "Bilgisayar nasıl yedeklenir?":"Önemli dosyaları harici diske veya buluta kopyalayın. Windows'ta Dosya Geçmişi, Mac'te Time Machine gibi araçlar kullanılabilir.",
    "Bilgisayar neden yavaşlar?":"Başlangıç uygulamaları, dolu disk, güncel olmayan yazılım veya donanım sorunları etkili olabilir. Görev Yöneticisi veya Etkinlik Monitörü ile yoğun işlemleri kontrol edin.",
    "Disk alanı nasıl boşaltılır?":"Geçici dosyaları, kullanılmayan uygulamaları ve büyük dosyaları kaldırın. Windows Depolama ve macOS Depolama Yönetimi bölümleri yardımcı olur.",
    "Bilgisayar neden ısınır?":"Yoğun uygulamalar, tıkanmış havalandırma veya sıcak ortam ısınmaya yol açabilir. Havalandırmayı açık tutun; sorun sürerse servis kontrolü gerekebilir.",
    "SSD sağlığı nasıl kontrol edilir?":"Üreticinin tanılama aracını veya işletim sisteminin disk denetim araçlarını kullanın. Kritik hata uyarısında verilerinizi hemen yedekleyin.",
    "Bilgisayar açılmıyorsa ne yapılır?":"Güç kablosu, adaptör ve priz bağlantısını kontrol edin; harici aksesuarları çıkarıp tekrar deneyin. Sorun sürerse teknik servis gerekebilir.",
    "Wi-Fi sorunu nasıl çözülür?":"Wi-Fi'yi kapatıp açın, ağı unutup yeniden bağlanın ve modemi kontrol edin. Sorun sürerse ağ ayarlarını veya üretici desteğini değerlendirin.",
    "Windows ekran görüntüsü nasıl alınır?":"Windows'ta Windows + Shift + S ile alan seçerek, Print Screen ile tam ekran görüntüsü alabilirsiniz. Kısayollar sürüme göre değişebilir.",
    "Mac ekran görüntüsü nasıl alınır?":"Mac'te Command + Shift + 3 tam ekranı, Command + Shift + 4 ise seçili alanı yakalar.",
    "Bilgisayar satmadan önce ne yapılmalıdır?":"Dosyaları yedekleyin, hesaplardan çıkış yapın, lisans ve kişisel bilgileri kaldırın; ardından işletim sistemini güvenli şekilde sıfırlayın.",
    "Windows sürümü nasıl öğrenilir?":"Ayarlar > Sistem > Hakkında bölümünden veya winver komutuyla Windows sürümünü görebilirsiniz.",
    "macOS sürümü nasıl öğrenilir?":"Ekranın sol üstündeki Apple menüsünden Bu Mac Hakkında seçeneğini açın.",
    "RAM miktarı nasıl öğrenilir?":"Windows'ta Ayarlar > Sistem > Hakkında, Mac'te Bu Mac Hakkında bölümünde bellek miktarı görünür.",
    "Akıllı saat nasıl sıfırlanır?":"Saatin Ayarlar menüsündeki Sıfırla seçeneğini kullanın. Menü adı marka ve modele göre değişebilir; önce eşleşme ve verileri kontrol edin.",
    "Akıllı saat nasıl yeniden başlatılır?":"Genellikle yan düğme veya güç menüsünden yeniden başlat seçeneğini kullanın. Donmuş cihazlarda üreticinin zorla yeniden başlatma adımını doğrulayın.",
    "Telefonla nasıl eşleştirilir?":"Saat uygulamasını açıp ekrandaki eşleştirme adımlarını izleyin. Bluetooth ve gerekli uygulama izinleri açık olmalıdır.",
    "Telefon eşleşmesi nasıl kaldırılır?":"Saat uygulamasından eşleşmeyi kaldırın; bu işlem çoğu modelde saati sıfırlayabilir. Satış öncesinde hesabınızdan da kaldırın.",
    "Apple Watch nasıl sıfırlanır?":"Saatte Ayarlar > Genel > Sıfırla yolunu kullanabilir veya iPhone'daki Watch uygulamasından eşleşmeyi kaldırabilirsiniz.",
    "Galaxy Watch nasıl sıfırlanır?":"Saat ayarlarından Sıfırla seçeneğini veya Galaxy Wearable uygulamasını kullanın. Adımlar model ve yazılım sürümüne göre değişebilir.",
    "Pil ömrü nasıl uzatılır?":"Ekran parlaklığını ve gereksiz bildirimleri azaltın; kullanmadığınız bağlantıları kapatın. Pil tasarrufu seçenekleri markaya göre değişir.",
    "Saat şarj olmuyorsa ne yapılır?":"Şarj pedi ve adaptörün uyumlu olduğundan, temas yüzeylerinin temiz olduğundan emin olun. Sorun devam ederse servis desteği gerekebilir.",
    "Bildirimler gelmiyorsa ne yapılır?":"Telefon ve saat arasındaki Bluetooth bağlantısını, uygulama izinlerini ve bildirim ayarlarını kontrol edin.",
    "Akıllı saat satmadan önce ne yapılmalıdır?":"Telefon eşleşmesini kaldırın, hesaptan çıkın ve saati fabrika ayarlarına döndürün. Veri kaybını önlemek için gerekli bilgileri önce yedekleyin.",
    "Yazılım güncellemesi nasıl yapılır?":"Saatin ayarlarındaki Yazılım Güncelleme bölümünü veya eşleştirilmiş telefon uygulamasını kullanın. Şarj seviyesi ve bağlantı gereksinimleri modele göre değişir.",
    "Su kilidi nedir?":"Bazı saatlerde ekranın yanlış dokunmalarını önleyen moddur. Apple Watch gibi desteklenen modellerde su tahliyesi işleviyle birlikte kullanılabilir.",
    "Kayıp akıllı saat nasıl bulunur?":"Eşleştirilmiş telefonun bulma uygulamasından son konumu veya ses çaldırma seçeneğini kontrol edin. Bu özellik marka ve ayarlara bağlıdır.",
    "PlayStation nasıl sıfırlanır?":"Ayarlar içindeki Başlatma veya Sistem Yazılımı bölümünden sıfırlama seçeneğini kullanın. Kayıtlar ve hesap verileri silinebileceği için önce yedekleyin.",
    "Xbox nasıl sıfırlanır?":"Ayarlar > Sistem > Konsol bilgileri içinden Konsolu sıfırla seçeneğini kullanın. Oyunları koruma seçeneği olsa da kayıtları yedeklemek güvenlidir.",
    "Nintendo Switch nasıl sıfırlanır?":"Sistem Ayarları > Sistem > Biçimlendirme Seçenekleri bölümünü kontrol edin. Hesap ve kayıt verileri için Nintendo'nun güncel yönergelerini doğrulayın.",
    "Konsol nasıl yeniden başlatılır?":"Güç menüsünden yeniden başlatmayı seçin; yanıt vermiyorsa güç düğmesini birkaç saniye basılı tutun. Süre modele göre değişebilir.",
    "Oyunlar nasıl yedeklenir?":"Dijital oyunlar genellikle hesapla ilişkilidir; kayıt verileri ise bulut veya harici depolama desteğine göre yedeklenebilir.",
    "Kayıtlı oyun verileri nasıl yedeklenir?":"Konsolun bulut kayıt veya desteklenen harici depolama seçeneklerini kontrol edin. PlayStation ve Xbox'ta abonelik gereksinimleri değişebilir.",
    "Kontrolcü nasıl eşleştirilir?":"Konsolun eşleştirme modunu açın ve kontrolcünün eşleştirme düğmesini kullanın. Kabloyla bağlama seçeneği modele göre bulunabilir.",
    "Kontrolcü bağlantı sorunu nasıl çözülür?":"Kontrolcüyü şarj edin, yeniden eşleştirin ve konsolu yeniden başlatın. Sorun devam ederse kablo veya donanım kontrolü gerekebilir.",
    "Konsol internete bağlanmıyorsa ne yapılır?":"Ağ ayarlarını ve modemi kontrol edin; ağı unutup yeniden bağlanmayı deneyin. Sunucu kesintileri de bağlantıyı etkileyebilir.",
    "Konsol neden ısınır?":"Uzun oyun oturumları, kapalı alan ve tozlu havalandırma ısınmayı artırabilir. Konsolu iyi havalandırılan bir yerde kullanın.",
    "Konsol satmadan önce ne yapılmalıdır?":"Kayıtları yedekleyin, hesapları kaldırın, cihazı sıfırlayın ve aksesuarları kontrol edin. Sıfırlama kişisel verileri siler.",
    "Hesap konsoldan nasıl kaldırılır?":"Kullanıcı veya hesap ayarlarından hesabınızı seçip kaldırın. Satış öncesi konsolu sıfırlamak ek bir güvenlik adımıdır.",
    "Sistem yazılımı nasıl güncellenir?":"Konsolun Ayarlar > Sistem veya Güncelleme bölümünden güncellemeleri kontrol edin. İnternet bağlantısı ve yeterli depolama gerekebilir."
  };
  const center=document.getElementById("viewDidYouKnow");
  if(!center) return;
  const imeiInput=document.getElementById("didYouKnowImeiInput");
  const imeiButton=document.getElementById("didYouKnowImeiButton");
  if(imeiInput && imeiButton){
    const updateImeiButton=function(){
      imeiInput.value=imeiInput.value.replace(/\D/g,"").slice(0,15);
      const valid=imeiInput.value.length===15;
      imeiButton.classList.toggle("is-disabled",!valid);
      imeiButton.setAttribute("aria-disabled",String(!valid));
      imeiButton.tabIndex=valid ? 0 : -1;
    };
    imeiInput.addEventListener("input",updateImeiButton);
    imeiButton.addEventListener("click",function(event){
      if(imeiButton.getAttribute("aria-disabled")==="true") event.preventDefault();
    });
    updateImeiButton();
  }
  const guideLinks={
    "Telefon":{"Ekran görüntüsü nasıl alınır?":"/rehber/android/android-ekran-goruntusu-nasil-alinir/","Telefon nasıl yeniden başlatılır?":"/rehber/android/android-yeniden-baslatma/","Telefon nasıl sıfırlanır?":"/rehber/android/android-telefon-nasil-sifirlanir/","IMEI / BTK sorgulama nasıl yapılır?":"/rehber/telefon/imei-sorgulama/","Telefon nasıl yedeklenir?":"/rehber/android/android-telefon-yedekleme/","Depolama alanı nasıl boşaltılır?":"/rehber/android/android-depolama-nasil-bosaltirilir/","Telefon satmadan önce ne yapılmalıdır?":"/rehber/android/android-telefon-satmadan-once/","iCloud hesabından nasıl çıkış yapılır?":"/rehber/ios/iphone-satmadan-once-ne-yapilmali/"},
    "Tablet":{"Ekran görüntüsü nasıl alınır?":"/rehber/ipados/ipad-ekran-goruntusu/","Tablet nasıl sıfırlanır?":"/rehber/ipados/ipad-nasil-sifirlanir/","Tablet nasıl yedeklenir?":"/rehber/ipados/ipad-yedekleme/","Depolama alanı nasıl boşaltılır?":"/rehber/ipados/ipad-depolama-bosaltma/"},
    "Bilgisayar":{"Windows bilgisayar nasıl sıfırlanır?":"/rehber/windows/windows-nasil-sifirlanir/","Mac nasıl sıfırlanır?":"/rehber/macos/mac-nasil-sifirlanir/","Bilgisayar nasıl yedeklenir?":"/rehber/windows/windows-bilgisayar-yedekleme/","Disk alanı nasıl boşaltılır?":"/rehber/windows/windows-disk-alani-bosaltma/","Windows ekran görüntüsü nasıl alınır?":"/rehber/windows/windows-ekran-goruntusu/","Mac ekran görüntüsü nasıl alınır?":"/rehber/macos/mac-ekran-goruntusu/","Windows sürümü nasıl öğrenilir?":"/rehber/windows/windows-surumu-nasil-ogrenilir/","macOS sürümü nasıl öğrenilir?":"/rehber/macos/macos-surumu-nasil-ogrenilir/"},
    "Akıllı Saat":{"Apple Watch nasıl sıfırlanır?":"/rehber/watchos/apple-watch-nasil-sifirlanir/","Akıllı saat nasıl yeniden başlatılır?":"/rehber/watchos/apple-watch-yeniden-baslatma/","Telefonla nasıl eşleştirilir?":"/rehber/watchos/apple-watch-eslestirme/","Galaxy Watch nasıl sıfırlanır?":"/rehber/wear-os/galaxy-watch-nasil-sifirlanir/","Galaxy Watch nasıl yeniden başlatılır?":"/rehber/wear-os/galaxy-watch-yeniden-baslatma/"},
    "Oyun Konsolu":{"PlayStation nasıl sıfırlanır?":"/rehber/playstation/playstation-nasil-sifirlanir/","Xbox nasıl sıfırlanır?":"/rehber/xbox/xbox-nasil-sifirlanir/","Nintendo Switch nasıl sıfırlanır?":"/rehber/nintendo/nintendo-switch-nasil-sifirlanir/","Kontrolcü nasıl eşleştirilir?":"/rehber/playstation/playstation-kol-eslestirme/","Depolama alanı nasıl boşaltılır?":"/rehber/playstation/playstation-depolama-bosaltma/"}
  };
  center.querySelectorAll("[data-guide-topic]").forEach(function(item){
    const topic=item.dataset.guideTopic;
    const question=document.createElement("strong");
    const answer=document.createElement("span");
    question.className="kg-dyk-question";
    answer.className="kg-dyk-answer";
    question.textContent=topic;
    answer.textContent=answers[topic] || "Cihazın Ayarlar veya Sistem bölümünden ilgili seçeneği kontrol edin; menü adları modele ve yazılım sürümüne göre değişebilir.";
    item.replaceChildren(question,answer);
    const category=item.closest(".kg-dyk-category")?.querySelector("h3")?.textContent;
    const url=guideLinks[category]?.[topic];
    if(url){const link=document.createElement("a");link.className="kg-dyk-guide-link";link.href=url;link.textContent=topic==="IMEI / BTK sorgulama nasıl yapılır?" ? "Detaylı IMEI ve BTK sorgulama rehberini gör →" : "Detaylı anlatımı gör →";item.appendChild(link);}
  });

  const keywordGroups=[
    {test:/sıfırla|fabrika ayar|biçimlendirme|başlatma/i, words:"sıfırla sıfırlama sıfırlamak sıfırlanır reset resetleme fabrika ayarı fabrika ayarları format cihazı silme iphone android windows mac playstation xbox nintendo"},
    {test:/ekran görüntüsü|screenshot/i, words:"ekran görüntüsü ekran resmi screenshot ss ekran fotoğrafı ekran görüntüsü alma"},
    {test:/pil|şarj/i, words:"pil pil sağlığı batarya batarya sağlığı battery şarj pil ömrü şarj hızlı bitiyor"},
    {test:/imei|btk|telefon kayıt|kayıt durumu|kayıtlı mı|kaçak telefon|yurtdışı telefon|çalıntı telefon|kayıp telefon/i, words:"imei imei sorgulama btk btk imei telefon kayıt kayıt durumu kayıtlı mı kaçak telefon yurtdışı telefon çalıntı telefon kayıp telefon *#06# imei öğrenme imei numarası seri numarası"},
    {test:/yeniden başlat/i, words:"yeniden başlatma restart kapat aç güç düğmesi"},
    {test:/yedek/i, words:"yedek yedekleme backup iCloud Google Drive bulut harici disk"},
    {test:/depolama|disk alanı|ssd/i, words:"depolama hafıza alan boşaltma yer açma disk ssd kapasite"},
    {test:/yavaş/i, words:"yavaş kasma donma performans hızlandırma"},
    {test:/ısın/i, words:"ısınma sıcak aşırı ısınma fan havalandırma"},
    {test:/wi-fi|internete bağlan/i, words:"wifi wi-fi kablosuz internet bağlantı ağ modem"},
    {test:/satmadan önce/i, words:"satış satmadan önce ikinci el cihazı satma hesap çıkışı veri silme"},
    {test:/hesap.*çıkış|iCloud|Google hesabı/i, words:"hesap çıkış yapma iCloud Apple Hesabı Google hesabı cihaz bulma kilit"},
    {test:/kontrolcü/i, words:"kontrolcü kol gamepad eşleştirme bağlantı"},
    {test:/sürüm|yazılım güncelleme/i, words:"yazılım güncelleme sistem sürümü update güncel"}
  ];
  const normalize=function(value){
    return String(value||"").toLocaleLowerCase("tr-TR").replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9*#]+/g," ").trim();
  };
  const cards=Array.from(center.querySelectorAll(".kg-dyk-category"));
  cards.forEach(function(card){
    const category=card.querySelector("h3")?.textContent||"";
    card.querySelectorAll("[data-guide-topic]").forEach(function(item){
      const topic=item.dataset.guideTopic;
      const answerText=answers[topic]||"";
      const aliases=keywordGroups.filter(function(group){return group.test.test(topic+" "+answerText);}).map(function(group){return group.words;}).join(" ");
      item.dataset.search=normalize([category,topic,answerText,aliases,"bilgi merkezi cihaz rehberi"].join(" "));
    });
  });
  const input=document.getElementById("didYouKnowSearch");
  const status=document.getElementById("didYouKnowSearchStatus");
  const grid=center.querySelector(".kg-dyk-grid");
  const empty=document.createElement("p");
  empty.className="kg-dyk-search-empty";
  empty.hidden=true;
  empty.textContent="Bu aramayla eşleşen bilgi bulunamadı.";
  grid.appendChild(empty);
  function resetSearch(){
    cards.forEach(function(card){
      card.hidden=false;
      card.querySelectorAll("[data-guide-topic]").forEach(function(item){item.hidden=false;});
      card.querySelectorAll(".kg-dyk-more").forEach(function(more){more.hidden=false;more.open=false;});
    });
    empty.hidden=true;
    status.textContent="";
  }
  function search(){
    const terms=normalize(input.value).split(/\s+/).filter(Boolean);
    if(!terms.length){resetSearch();return;}
    let total=0;
    cards.forEach(function(card){
      let cardMatches=0;
      card.querySelectorAll("[data-guide-topic]").forEach(function(item){
        const match=terms.every(function(term){return item.dataset.search.includes(term);});
        item.hidden=!match;
        if(match){cardMatches++;total++;}
      });
      card.hidden=cardMatches===0;
      card.querySelectorAll(".kg-dyk-more").forEach(function(more){
        const hasExtraMatch=Array.from(more.querySelectorAll("[data-guide-topic]")).some(function(item){return !item.hidden;});
        more.hidden=!hasExtraMatch;
        more.open=hasExtraMatch;
      });
    });
    empty.hidden=total!==0;
    status.textContent=total ? total+" ilgili bilgi bulundu." : "";
  }
  if(input) input.addEventListener("input",search);
})();
