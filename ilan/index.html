<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>KaçaGider İlan Detayı — Test</title>
  <style>
    :root{--navy:#07182b;--green:#12b84f;--text:#101828;--muted:#667085;--line:#e5e7eb;--soft:#f8fafc}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:var(--text)}
    .top{background:var(--navy);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:25px;font-weight:950;letter-spacing:-.7px}.brand span{color:#15c45a}.brand small{display:block;font-size:10px;color:#cbd5e1;font-weight:700;margin-top:2px}.top a{color:#fff;text-decoration:none;font-weight:850;font-size:13px}.top .cta{background:var(--green);padding:11px 15px;border-radius:10px}
    .wrap{max-width:1180px;margin:0 auto;padding:34px 22px 60px}.back{display:inline-block;margin-bottom:18px;color:#475467;font-weight:850;text-decoration:none;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
    .gallery{min-height:460px;background:linear-gradient(145deg,#f9fbfd,#edf2f7);display:flex;align-items:center;justify-content:center;border-radius:20px 20px 0 0;font-size:120px}.content{padding:22px}.eyebrow{font-size:12px;font-weight:900;color:#667085;margin-bottom:7px}.title{font-size:30px;line-height:1.1;font-weight:950;letter-spacing:-.7px;margin:0 0 9px}.location{color:#667085;font-size:13px;margin-bottom:20px}.desc{line-height:1.65;color:#475467;font-size:14px;white-space:pre-wrap}
    .side{padding:20px;position:sticky;top:20px;height:max-content}.asking{font-size:34px;font-weight:950;letter-spacing:-.8px;margin-bottom:14px}.estimate{border:1px solid #b7e8c9;background:#f2fff6;border-radius:14px;padding:14px;margin-bottom:14px}.estimate span{display:block;font-size:10px;color:#4b5563;font-weight:850}.estimate strong{display:block;color:#0b8f3f;font-size:23px;margin-top:3px}.diff{font-size:11px;color:#667085;margin-top:5px}.seller{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.seller strong{display:block;font-size:15px;margin-bottom:3px}.seller span{font-size:12px;color:#667085}.contact{display:block;width:100%;margin-top:16px;border:0;border-radius:12px;background:var(--green);color:#fff;padding:14px;font-weight:950;font-size:14px;cursor:pointer}.safe{margin-top:12px;padding:11px 12px;border-radius:11px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:11px;line-height:1.5}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.fact{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfcfe}.fact span{display:block;font-size:9px;color:#667085;font-weight:800}.fact strong{display:block;margin-top:3px;font-size:13px}.notfound{text-align:center;padding:70px 20px}.notfound h1{font-size:28px}.notfound a{color:#0b8f3f;font-weight:900}
    @media(max-width:860px){.layout{grid-template-columns:1fr}.side{position:static}.gallery{min-height:330px}.facts{grid-template-columns:1fr 1fr}}@media(max-width:520px){.top{padding:14px}.wrap{padding:24px 13px 50px}.title{font-size:25px}.gallery{min-height:260px;font-size:90px}.facts{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="top"><div class="brand">kaca<span>gider</span>.com.tr<small>İkinci elin gerçek fiyatı</small></div><nav><a href="/ilanlar/">İlanlar</a> &nbsp; <a class="cta" href="/">Ücretsiz İlan Ver</a></nav></header>
<main class="wrap" id="app"></main>
<script>
(function(){
  const KEY='kg_marketplace_listings_v1';
  const icon={Telefon:'📱',Tablet:'▣',Bilgisayar:'💻','Akıllı Saat':'⌚','Oyun Konsolu':'🎮'};
  const app=document.getElementById('app');
  function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
  function money(v){return Number(v||0).toLocaleString('tr-TR')+' TL'}
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
  const index=Number(new URLSearchParams(location.search).get('i'));
  const all=read(); const x=Number.isInteger(index)?all[index]:null;
  if(!x){app.innerHTML='<div class="panel notfound"><h1>İlan bulunamadı</h1><p>İlan kaldırılmış olabilir veya bağlantı geçersiz.</p><a href="/ilanlar/">İlanlara dön</a></div>';return}
  const ask=Number(x.salePrice||0), est=Number(x.estimatedPrice||0), delta=ask-est;
  const diffText=est? (delta===0?'İlan fiyatı KaçaGider tahminiyle aynı.':(delta>0?money(Math.abs(delta))+' tahminin üzerinde.':money(Math.abs(delta))+' tahminin altında.')):'';
  app.innerHTML='<a class="back" href="/ilanlar/">← İlanlara dön</a><div class="layout"><section class="panel"><div class="gallery">'+(icon[x.category]||'📦')+'</div><div class="content"><div class="eyebrow">'+esc(x.category||'Cihaz')+' · '+esc(x.storage||'')+'</div><h1 class="title">'+esc([x.brand,x.model,x.storage].filter(Boolean).join(' '))+'</h1><div class="location">📍 '+esc([x.city,x.district].filter(Boolean).join(', '))+'</div><div class="facts"><div class="fact"><span>KATEGORİ</span><strong>'+esc(x.category||'—')+'</strong></div><div class="fact"><span>HAFIZA</span><strong>'+esc(x.storage||'—')+'</strong></div><div class="fact"><span>İLAN DURUMU</span><strong>Aktif</strong></div></div><h3>Açıklama</h3><div class="desc">'+esc(x.description||'Satıcı açıklama eklememiş.')+'</div></div></section><aside class="panel side"><div class="asking">'+money(ask)+'</div><div class="estimate"><span>KAÇAGİDER TAHMİNİ DEĞERİ</span><strong>'+money(est)+'</strong><div class="diff">'+esc(diffText)+'</div></div><div class="seller"><strong>Satıcı</strong><span>Test kullanıcı · Bireysel satıcı</span></div><button class="contact" id="contact">Satıcıyla İletişime Geç</button><div class="safe">Test sürümü: Bu buton henüz gerçek mesajlaşma veya telefon bilgisi açmaz. Sonraki aşamada güvenli iletişim ve üyelik sistemi bağlanacak.</div></aside></div>';
  document.getElementById('contact').addEventListener('click',()=>alert('Test sürümü: Satıcıyla iletişim modülü sonraki aşamada bağlanacak.'));
})();
</script>
</body>
</html>
