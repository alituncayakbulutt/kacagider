<style>
:root{--navy:#07182b;--green:#12b84f;--text:#101828;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:var(--text)}.top{background:var(--navy);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:25px;font-weight:950;letter-spacing:-.7px;color:#fff;text-decoration:none;display:block}.brand span{color:#15c45a}.brand small{display:block;font-size:10px;color:#cbd5e1;font-weight:700;margin-top:2px}.top a{color:#fff;text-decoration:none;font-weight:850;font-size:13px}.top .cta{background:var(--green);padding:11px 15px;border-radius:10px}.wrap{max-width:1180px;margin:0 auto;padding:34px 22px 60px}.back{display:inline-block;margin-bottom:18px;color:#475467;font-weight:850;text-decoration:none;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.05)}.gallery{background:linear-gradient(145deg,#f9fbfd,#edf2f7);border-radius:20px 20px 0 0;overflow:hidden}.gallery-main{height:480px;display:flex;align-items:center;justify-content:center;font-size:120px}.gallery-main img{width:100%;height:100%;object-fit:contain;background:#f8fafc;padding:22px}.thumbs{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line);overflow:auto}.thumb{width:74px;height:74px;border:2px solid transparent;border-radius:9px;overflow:hidden;padding:0;background:#f2f4f7;cursor:pointer;flex:0 0 auto}.thumb.active{border-color:var(--green)}.thumb img{width:100%;height:100%;object-fit:cover}.content{padding:22px}.eyebrow{font-size:12px;font-weight:900;color:#667085;margin-bottom:7px}.title{font-size:30px;line-height:1.1;font-weight:950;letter-spacing:-.7px;margin:0 0 9px}.location{color:#667085;font-size:13px;margin-bottom:20px}.desc{line-height:1.65;color:#475467;font-size:14px;white-space:pre-wrap}.side{padding:20px;position:sticky;top:20px;height:max-content}.asking{font-size:34px;font-weight:950;letter-spacing:-.8px;margin-bottom:14px}.estimate{border:1px solid #b7e8c9;background:#f2fff6;border-radius:14px;padding:14px;margin-bottom:14px}.estimate span{display:block;font-size:10px;color:#4b5563;font-weight:850}.estimate strong{display:block;color:#0b8f3f;font-size:23px;margin-top:3px}.diff{font-size:11px;color:#667085;margin-top:5px}.seller{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.seller strong{display:block;font-size:15px;margin-bottom:3px}.seller span{font-size:12px;color:#667085}.contact{display:flex;align-items:center;justify-content:center;width:100%;margin-top:16px;border:0;border-radius:12px;background:var(--green);color:#fff;padding:14px;font-weight:950;font-size:14px;text-decoration:none}.safe{margin-top:12px;padding:11px 12px;border-radius:11px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:11px;line-height:1.5}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.fact{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfcfe}.fact span{display:block;font-size:9px;color:#667085;font-weight:800}.fact strong{display:block;margin-top:3px;font-size:13px}.details-title{margin:24px 0 10px;font-size:18px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail-item{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fbfcfe}.detail-item span{display:block;font-size:9px;color:#667085;font-weight:850;text-transform:uppercase}.detail-item strong{display:block;margin-top:4px;font-size:13px}.detail-empty{padding:13px;border:1px dashed #cbd5e1;border-radius:12px;color:#667085;font-size:12px}.notfound,.loading,.error{text-align:center;padding:70px 20px}.notfound h1,.error h1{font-size:28px}.notfound a,.error a{color:#0b8f3f;font-weight:900}.error{color:#b42318}@media(max-width:860px){.layout{grid-template-columns:1fr}.side{position:static}.gallery-main{height:360px}.facts{grid-template-columns:1fr 1fr}}@media(max-width:620px){.details{grid-template-columns:1fr}}@media(max-width:520px){.top{padding:14px}.wrap{padding:24px 13px 50px}.title{font-size:25px}.gallery-main{height:280px;font-size:90px}}

<body>
<header class="top"><a class="brand" href="/" aria-label="KaçaGider ana sayfa">kaca<span>gider</span>.com.tr<small>İkinci elin gerçek fiyatı</small></a><nav><a href="/ilanlar/">İlanlar</a> &nbsp; <a class="cta" href="/">Ücretsiz İlan Ver</a></nav></header>
<main class="wrap" id="app"><div class="panel loading">İlan yükleniyor…</div></main>
<script src="/data/model-images.js"></script>
<script src="/assets/supabase-marketplace.js"></script>
<script src="/assets/account-session-nav.js"></script>
<script>
(function(){
'use strict';
const icon={Telefon:'📱',Tablet:'▣',Bilgisayar:'💻','Akıllı Saat':'⌚','Oyun Konsolu':'🎮'},app=document.getElementById('app');
function money(v){return Number(v||0).toLocaleString('tr-TR')+' TL'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function listingDate(v){if(!v)return'—';const d=new Date(v);if(Number.isNaN(d.getTime()))return'—';return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'long',year:'numeric',timeZone:'Europe/Istanbul'}).format(d)}
function productTitle(x){const brand=String(x.brand||'').trim(),model=String(x.model||'').trim();if(!brand)return model;if(!model)return brand;return model.toLocaleLowerCase('tr-TR').startsWith(brand.toLocaleLowerCase('tr-TR')+' ')?model:brand+' '+model}
function details(items){if(!Array.isArray(items)||!items.length)return'<div class="detail-empty">Satıcı bu cihaz için ek kondisyon detayı paylaşmamış.</div>';return'<div class="details">'+items.map(d=>'<div class="detail-item"><span>'+esc(d.label||'Detay')+'</span><strong>'+esc(d.value||'—')+'</strong></div>').join('')+'</div>'}
function notFound(){app.innerHTML='<div class="panel notfound"><h1>İlan bulunamadı</h1><p>İlan kaldırılmış, satılmış veya bağlantı geçersiz olabilir.</p><a href="/ilanlar/">İlanlara dön</a></div>'}
function render(x){
 const title=productTitle(x),fallback=typeof window.getKgCategoryImage==='function'?window.getKgCategoryImage(x.category):'';
 document.title=[title,'İkinci El İlanı | KaçaGider'].filter(Boolean).join(' ');
 const ask=Number(x.salePrice||0),market=Number(x.marketValue||0),delta=ask-market,diff=market?(delta===0?'İlan fiyatı KaçaGider piyasa değeriyle aynı.':delta>0?money(Math.abs(delta))+' piyasa değerinin üzerinde.':money(Math.abs(delta))+' piyasa değerinin altında.'):'Piyasa karşılaştırması hazır değil.';
 const p=Array.isArray(x.photos)?x.photos.filter(Boolean):[];
 const onerror=fallback?' onerror="this.src=\''+esc(fallback)+'\';this.onerror=null"':'';
 const main=p.length?'<img id="mainPhoto" src="'+esc(p[0])+'" alt="'+esc([title,x.color].filter(Boolean).join(' '))+'"'+onerror+'>':fallback?'<img id="mainPhoto" src="'+esc(fallback)+'" alt="'+esc(title)+'">':(icon[x.category]||'📦');
 const thumbs=p.length>1?'<div class="thumbs">'+p.map((src,i)=>'<button class="thumb '+(i===0?'active':'')+'" data-photo="'+i+'"><img src="'+esc(src)+'" alt="Fotoğraf '+(i+1)+'"></button>').join('')+'</div>':'';
 const tel=String(x.contactPhone||'').replace(/[^0-9+]/g,''),contact=tel?'<a class="contact" href="tel:'+esc(tel)+'">Satıcıyı Ara · '+esc(x.contactPhone)+'</a>':'<div class="safe">Satıcı iletişim bilgisi paylaşmamış.</div>';
 app.innerHTML='<a class="back" href="/ilanlar/">← İlanlara dön</a><div class="layout"><section class="panel"><div class="gallery"><div class="gallery-main">'+main+'</div>'+thumbs+'</div><div class="content"><div class="eyebrow">'+esc([x.category,x.storage,x.color].filter(Boolean).join(' · '))+'</div><h1 class="title">'+esc([title,x.storage].filter(Boolean).join(' '))+'</h1><div class="location">📍 '+esc([x.city,x.district].filter(Boolean).join(', '))+'</div><div class="facts"><div class="fact"><span>KATEGORİ</span><strong>'+esc(x.category||'—')+'</strong></div><div class="fact"><span>KAPASİTE / VARYANT</span><strong>'+esc(x.storage||'—')+'</strong></div><div class="fact"><span>RENK</span><strong>'+esc(x.color||'—')+'</strong></div><div class="fact"><span>İLAN DURUMU</span><strong>Aktif</strong></div><div class="fact"><span>İLAN TARİHİ</span><strong>'+esc(listingDate(x.createdAt))+'</strong></div></div><h3 class="details-title">Cihaz Detayları</h3>'+details(x.details)+'<h3>Açıklama</h3><div class="desc">'+esc(x.description||'Satıcı açıklama eklememiş.')+'</div></div></section><aside class="panel side"><div class="asking">'+money(ask)+'</div><div class="estimate"><span>KAÇAGİDER PİYASA DEĞERİ</span><strong>'+money(market)+'</strong><div class="diff">'+esc(diff)+'</div></div><div class="seller"><strong>'+esc(x.sellerName||'Bireysel satıcı')+'</strong><span>Bireysel satıcı</span></div>'+contact+'<div class="safe">İlan fiyatı satıcı tarafından belirlenir. KaçaGider piyasa değeri ilan fiyatından bağımsızdır.</div></aside></div>';
 document.querySelectorAll('[data-photo]').forEach(b=>b.addEventListener('click',()=>{const img=document.getElementById('mainPhoto');if(img)img.src=p[Number(b.dataset.photo)];document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));b.classList.add('active')}));
}
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){notFound();return}try{if(!window.KGMarketplaceSupabase)throw new Error('Marketplace veri katmanı bulunamadı.');await window.KGMarketplaceSupabase.ready;const x=await window.KGMarketplaceSupabase.getListing(id);if(!x){notFound();return}render(x)}catch(error){console.error(error);app.innerHTML='<div class="panel error"><h1>İlan yüklenemedi</h1><p>Bağlantıyı kontrol edip tekrar deneyin.</p><a href="/ilanlar/">İlanlara dön</a></div>'}})();
})();
</script>
</body>
</html>
