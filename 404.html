<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sayfa Bulunamadı | KaçaGider</title>
  <meta name="description" content="Aradığınız KaçaGider sayfası bulunamadı. Ana sayfaya dönerek telefon, tablet, bilgisayar, akıllı saat ve oyun konsolu piyasa değerini öğrenebilirsiniz.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--navy:#071426;--green:#16a34a;--text:#101828;--muted:#667085;--line:#e5e7eb}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f8fb;color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:42px;box-shadow:0 18px 50px rgba(15,23,42,.08);text-align:center}
    .brand{font-size:30px;font-weight:950;color:var(--navy);text-decoration:none;letter-spacing:-1px}.brand span{color:var(--green)}
    .code{display:inline-flex;margin-top:24px;padding:7px 12px;border-radius:999px;background:#ecfdf3;color:#087a37;font-size:12px;font-weight:900}
    h1{font-size:38px;line-height:1.05;margin:14px 0 10px;letter-spacing:-1px}
    p{margin:0 auto;color:var(--muted);line-height:1.6;max-width:560px}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 17px;border-radius:12px;text-decoration:none;font-weight:900;font-size:14px;border:1px solid #d7dde5;color:#263245;background:#fff}.actions a.primary{background:var(--green);border-color:var(--green);color:#fff}
    .cats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:26px;font-size:12px}.cats a{color:#475467;text-decoration:none;font-weight:800}.cats a:hover{color:#087a37}
    @media(max-width:600px){.card{padding:30px 20px}h1{font-size:31px}}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/" aria-label="KaçaGider ana sayfa">kaca<span>gider</span>.com.tr</a>
    <div class="code">404 · SAYFA BULUNAMADI</div>
    <h1>Aradığınız sayfayı bulamadık.</h1>
    <p>Telefon, tablet, bilgisayar, akıllı saat veya oyun konsolunuzun güncel ikinci el piyasa değerini öğrenmek için ana sayfaya dönebilirsiniz.</p>
    <div class="actions">
      <a class="primary" href="/">Ana Sayfaya Dön</a>
      <a href="/bilgi-merkezi/">Bilgi Merkezi</a>
    </div>
    <nav class="cats" aria-label="Cihaz kategorileri">
      <a href="/telefon/">Telefon</a>
      <a href="/tablet/">Tablet</a>
      <a href="/bilgisayar/">Bilgisayar</a>
      <a href="/akilli-saat/">Akıllı Saat</a>
      <a href="/oyun-konsolu/">Oyun Konsolu</a>
    </nav>
  </main>
</body>
</html>
