<style>
:root{--navy:#07182b;--green:#12b84f;--text:#101828;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:var(--text)}button,input,select{font:inherit}.top{background:var(--navy);color:#fff;padding:17px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(2,6,23,.16)}.brand{font-size:25px;font-weight:950;letter-spacing:-.8px;line-height:1;color:#fff;text-decoration:none}.brand span{color:#15c45a}.brand small{display:block;font-size:10px;color:#cbd5e1;font-weight:700;margin-top:5px}.top nav{display:flex;align-items:center;gap:18px}.top nav a{color:#fff;text-decoration:none;font-weight:850;font-size:13px}.top .cta{background:var(--green);padding:11px 15px;border-radius:10px}.wrap{max-width:1380px;margin:0 auto;padding:36px 24px 60px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:22px}.hero h1{margin:0;font-size:38px;letter-spacing:-1.2px}.hero p{margin:8px 0 0;color:var(--muted);font-size:15px}.count{font-weight:900;color:#475467;white-space:nowrap}.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:14px;align-items:center;margin-bottom:12px}.search input{width:100%;height:48px;border:1px solid #d7dee8;border-radius:14px;background:#fff;padding:0 16px;outline:none}.search input:focus{border-color:#77d69a;box-shadow:0 0 0 3px rgba(18,184,79,.1)}.sort{height:48px;border:1px solid #d7dee8;border-radius:14px;background:#fff;padding:0 38px 0 14px;color:#344054;font-weight:750}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 24px}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;color:#475467;cursor:pointer}.filter.active{border-color:#8ee7ae;background:#effcf4;color:#087735}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{position:relative;background:#fff;border:1px solid #e4e9f0;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,.07);display:flex;flex-direction:column;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(15,23,42,.1)}.visual{height:235px;background:linear-gradient(180deg,#edf1f5,#e2e7ed);display:flex;align-items:center;justify-content:center;font-size:66px;overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.visual img.model-image{object-fit:contain;padding:18px}.placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#667085}.placeholder img{width:100%;height:100%;object-fit:contain;padding:28px}.fav{position:absolute;right:12px;top:12px;z-index:2;width:38px;height:38px;border:1px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(255,255,255,.94);cursor:pointer;font-size:20px}.fav.active{color:#e11d48}.body{padding:17px;display:flex;flex-direction:column;flex:1}.meta{font-size:11px;font-weight:850;color:#667085;margin-bottom:6px}.title{font-size:19px;line-height:1.22;font-weight:950;margin-bottom:9px}.loc{font-size:12px;color:#667085;margin-bottom:13px}.asking{font-size:25px;font-weight:950;margin-bottom:8px}.estimate{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid #e9edf2;margin-bottom:10px}.estimate span{font-size:11px;color:#667085}.estimate strong{font-size:14px;color:#16a34a}.market{display:inline-flex;width:max-content;max-width:100%;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;margin-bottom:13px}.market.good{background:#ecfdf3;color:#067647}.market.low{background:#eff8ff;color:#175cd3}.market.high{background:#fff7ed;color:#b54708}.market.veryhigh{background:#fff1f0;color:#b42318}.extra{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{font-size:10px;color:#475467;background:#f4f7fb;border:1px solid #e6ebf2;border-radius:999px;padding:5px 8px}.detail{display:block;width:100%;margin-top:auto;background:#081a35;color:#fff;border-radius:11px;padding:12px;font-weight:900;text-align:center;text-decoration:none}.empty,.loading,.error{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:50px 20px;text-align:center;color:#667085}.empty strong,.error strong{display:block;color:#101828;font-size:20px;margin-bottom:6px}.error{border-color:#fecaca;background:#fff7f7;color:#b42318}.notice{margin-top:26px;padding:13px 15px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;color:#166534;font-size:12px;line-height:1.55}@media(max-width:1120px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr}.sort{width:100%}.top{padding:15px}.wrap{padding:26px 14px 50px}}@media(max-width:540px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.visual{height:250px}.top nav{gap:10px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/" aria-label="KaçaGider ana sayfa">kaca<span>gider</span>.com.tr<small>İkinci elin gerçek fiyatı</small></a><nav><a href="/">Ana Sayfa</a><a class="cta" href="/">Ücretsiz İlan Ver</a></nav></header>
<main class="wrap">
<section class="hero"><div><h1>İlanlar</h1><p>Satıcının fiyatını KaçaGider piyasa değeriyle birlikte değerlendir.</p></div><div class="count" id="count">Yükleniyor…</div></section>
<section class="toolbar"><div class="search"><input id="search" type="search" placeholder="Marka, model, şehir veya renk ara" aria-label="İlanlarda ara"></div><select class="sort" id="sort" aria-label="İlanları sırala"><option value="new">En yeni ilanlar</option><option value="low">Fiyat: düşükten yükseğe</option><option value="high">Fiyat: yüksekten düşüğe</option><option value="closest">KaçaGider değerine en yakın</option></select></section>
<div class="filters" id="filters"><button class="filter active" data-filter="all">Tümü</button><button class="filter" data-filter="Telefon">Telefon</button><button class="filter" data-filter="Tablet">Tablet</button><button class="filter" data-filter="Bilgisayar">Bilgisayar</button><button class="filter" data-filter="Akıllı Saat">Akıllı Saat</button><button class="filter" data-filter="Oyun Konsolu">Oyun Konsolu</button></div>
<section class="grid" id="grid"><div class="loading">İlanlar yükleniyor…</div></section>
<div class="notice">KaçaGider piyasa değeri satıcının ilan fiyatından bağımsızdır. İlan fiyatı satıcı tarafından belirlenir.</div>
</main>
<script src="/data/model-images.js"></script>
<script src="/assets/supabase-marketplace.js"></script>
<script src="/assets/account-session-nav.js"></script>
<script>
(function(){
'use strict';
const FAV='kg_marketplace_favorites_v1';
const icon={Telefon:'📱',Tablet:'▣',Bilgisayar:'💻','Akıllı Saat':'⌚','Oyun Konsolu':'🎮'};
const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),sort=document.getElementById('sort');
let filter='all',all=[];
search.value=new URLSearchParams(location.search).get('q')||'';
function readFav(){try{return JSON.parse(localStorage.getItem(FAV)||'[]')}catch(e){return[]}}
function writeFav(v){try{localStorage.setItem(FAV,JSON.stringify(v))}catch(e){}}
function money(v){return Number(v||0).toLocaleString('tr-TR')+' TL'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function productTitle(x){const brand=String(x.brand||'').trim(),model=String(x.model||'').trim();if(!brand)return model;if(!model)return brand;return model.toLocaleLowerCase('tr-TR').startsWith(brand.toLocaleLowerCase('tr-TR')+' ')?model:brand+' '+model}
function marketInfo(x){const ask=Number(x.salePrice||0),est=Number(x.marketValue||0);if(!ask||!est)return{c:'good',t:'Fiyat karşılaştırması hazır değil',d:999};const pct=((ask-est)/est)*100,abs=Math.abs(pct);if(pct<=-5)return{c:'low',t:'Piyasa değerinin %'+Math.round(abs)+' altında',d:abs};if(abs<=5)return{c:'good',t:'Piyasa değerine yakın',d:abs};if(pct<=15)return{c:'high',t:'Piyasa değerinin %'+Math.round(abs)+' üzerinde',d:abs};return{c:'veryhigh',t:'Piyasa değerinin %'+Math.round(abs)+' üzerinde',d:abs}}
function fallbackMedia(x,alt,hidden){const src=typeof window.getKgCategoryImage==='function'?window.getKgCategoryImage(x.category):'';return '<div class="placeholder"'+(hidden?' style="display:none"':'')+'>'+(src?'<img class="model-image" src="'+esc(src)+'" alt="'+alt+'" loading="lazy">':(icon[x.category]||'📦'))+'</div>'}
function media(x){const alt=esc(productTitle(x)),photo=Array.isArray(x.photos)&&x.photos[0]?x.photos[0]:'';if(photo)return '<img src="'+esc(photo)+'" alt="'+alt+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'+fallbackMedia(x,alt,true);return fallbackMedia(x,alt,false)}
function render(){
 const favs=readFav(),term=search.value.trim().toLocaleLowerCase('tr-TR');
 let rows=all.map(x=>({x,m:marketInfo(x)})).filter(r=>filter==='all'||r.x.category===filter).filter(r=>!term||[r.x.brand,r.x.model,r.x.storage,r.x.color,r.x.city,r.x.district,r.x.category].filter(Boolean).join(' ').toLocaleLowerCase('tr-TR').includes(term));
 if(sort.value==='low')rows.sort((a,b)=>a.x.salePrice-b.x.salePrice);if(sort.value==='high')rows.sort((a,b)=>b.x.salePrice-a.x.salePrice);if(sort.value==='closest')rows.sort((a,b)=>a.m.d-b.m.d);if(sort.value==='new')rows.sort((a,b)=>new Date(b.x.publishedAt||b.x.createdAt||0)-new Date(a.x.publishedAt||a.x.createdAt||0));
 count.textContent=all.length+' aktif ilan';
 if(!rows.length){grid.innerHTML='<div class="empty"><strong>İlan bulunamadı</strong>Arama veya filtrelerini değiştirerek tekrar deneyebilirsin.</div>';return;}
 grid.innerHTML=rows.map(({x,m})=>{const fav=favs.includes(x.id)?' active':'',chips=[x.storage,x.color].filter(Boolean).map(v=>'<span class="chip">'+esc(v)+'</span>').join('');return '<article class="card"><button class="fav'+fav+'" data-fav="'+esc(x.id)+'" aria-label="Favorilere ekle">'+(fav?'♥':'♡')+'</button><div class="visual">'+media(x)+'</div><div class="body"><div class="meta">'+[x.category,x.storage,x.color].filter(Boolean).map(esc).join(' · ')+'</div><div class="title">'+esc(productTitle(x))+'</div><div class="loc">📍 '+esc([x.city,x.district].filter(Boolean).join(', '))+'</div><div class="asking">'+money(x.salePrice)+'</div><div class="estimate"><span>KaçaGider piyasa değeri</span><strong>'+money(x.marketValue)+'</strong></div><div class="market '+m.c+'">'+esc(m.t)+'</div><div class="extra">'+chips+'</div><a class="detail" href="/ilan/?id='+encodeURIComponent(x.id)+'">İlanı Gör</a></div></article>'}).join('');
}
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
grid.addEventListener('click',e=>{const b=e.target.closest('[data-fav]');if(!b)return;e.preventDefault();let f=readFav(),id=b.dataset.fav;f=f.includes(id)?f.filter(x=>x!==id):f.concat(id);writeFav(f);render()});
search.addEventListener('input',render);sort.addEventListener('change',render);
(async()=>{try{if(!window.KGMarketplaceSupabase)throw new Error('Marketplace veri katmanı bulunamadı.');await window.KGMarketplaceSupabase.ready;all=await window.KGMarketplaceSupabase.listPublished();render()}catch(error){console.error(error);count.textContent='';grid.innerHTML='<div class="error"><strong>İlanlar yüklenemedi</strong>Bağlantıyı kontrol edip sayfayı yenileyin.</div>'}})();
})();
</script>
</body>
</html>
