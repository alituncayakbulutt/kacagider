name: SEO Stages 4-10 Audit

on:
  push:
    branches:
      - main
    paths:
      - "scripts/seo-site-audit.py"
      - "scripts/seo-model-intent-audit.py"
      - "scripts/seo-model-listing-intent-audit.py"
      - ".github/workflows/seo-stages-4-10-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-stages-4-10-audit
  cancel-in-progress: true

jobs:
  audit-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SEO audit engines
        run: python3 -m py_compile scripts/seo-site-audit.py scripts/seo-model-intent-audit.py scripts/seo-model-listing-intent-audit.py

      - name: Full SEO audit
        run: python3 scripts/seo-site-audit.py

      - name: Model intent audit
        run: python3 scripts/seo-model-intent-audit.py

      - name: Listing intent audit
        run: python3 scripts/seo-model-listing-intent-audit.py

      - name: Confirm workflow is read only
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            echo "SEO audit modified repository files; refusing mutation."
            git status --short
            exit 1
          fi
