name: SEO Legacy Stages Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-legacy-stages-audit
  cancel-in-progress: true

jobs:
  audit-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Explain V3 policy
        run: |
          echo "Legacy model/listing intent expansion audits are retired."
          echo "They previously required repeated query variants on every model page."
          echo "SEO V3 uses one intent cluster per landing and one primary URL per model."

      - name: Run V3 architecture audit
        run: python3 scripts/seo-v3-architecture-audit.py

      - name: Confirm workflow is read only
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            echo "SEO audit modified repository files; refusing mutation."
            git status --short
            exit 1
          fi
