name: Marketplace Mobile Header Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marketplace-mobile-header-fix.yml'

permissions:
  contents: write

jobs:
  patch-marketplace-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Attach mobile header fix only to listing pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker = '<link rel="stylesheet" href="/assets/marketplace-mobile-header-fix.css?v=20260901-1">'
          for name in ['ilanlar/index.html','ilan/index.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if marker in s:
                  continue
              needle='<link rel="icon" href="/favicon.svg" type="image/svg+xml">'
              if needle not in s:
                  raise SystemExit(f'{name}: favicon satiri bulunamadi; dosya degistirilmedi')
              s=s.replace(needle, needle+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify scoped stylesheet links
        run: |
          grep -F '/assets/marketplace-mobile-header-fix.css?v=20260901-1' ilanlar/index.html
          grep -F '/assets/marketplace-mobile-header-fix.css?v=20260901-1' ilan/index.html

      - name: Commit only listing pages
        shell: bash
        run: |
          if git diff --quiet -- ilanlar/index.html ilan/index.html; then
            echo 'Ilan sayfalari zaten guncel.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ilanlar/index.html ilan/index.html
          git commit -m 'Ilan sayfalarinda mobil ust bari duzelt'
          git push origin HEAD:main
