name: Marketplace Mobile Header Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marketplace-mobile-header-fix.yml'

permissions:
  contents: write

jobs:
  patch-marketplace-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh mobile header fix version only on listing pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = '/assets/marketplace-mobile-header-fix.css?v=20260901-1'
          new = '/assets/marketplace-mobile-header-fix.css?v=20260901-2'
          for name in ['ilanlar/index.html','ilan/index.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{name}: eski mobil header CSS surumu bulunamadi; dosya degistirilmedi')
              s=s.replace(old,new,1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify scoped stylesheet links
        run: |
          grep -F '/assets/marketplace-mobile-header-fix.css?v=20260901-2' ilanlar/index.html
          grep -F '/assets/marketplace-mobile-header-fix.css?v=20260901-2' ilan/index.html

      - name: Commit only listing pages
        shell: bash
        run: |
          if git diff --quiet -- ilanlar/index.html ilan/index.html; then
            echo 'Ilan sayfalari zaten guncel.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ilanlar/index.html ilan/index.html
          git commit -m 'Ilan mobil header CSS surumunu yenile'
          git push origin HEAD:main
