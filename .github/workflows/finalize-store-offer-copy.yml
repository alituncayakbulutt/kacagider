name: Finalize Store Offer Copy

on:
  push:
    branches: [generalize-store-offers]
    paths:
      - 'scripts/finalize-store-offer-copy.py'
      - '.github/workflows/finalize-store-offer-copy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generalize-store-offers
          fetch-depth: 1
      - name: Apply copy cleanup
        run: python scripts/finalize-store-offer-copy.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/marketplace-sell-options-modal.js
          node --check assets/marketplace-damage-guard.js
          node --check assets/marketplace-sell-options.js
      - name: Commit and remove one-off tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/finalize-store-offer-copy.py .github/workflows/finalize-store-offer-copy.yml
          git add assets/marketplace-sell-options-modal.js assets/marketplace-damage-guard.js assets/marketplace-sell-options.js
          git commit -m "Use generic store wording across device offers"
          git push origin HEAD:generalize-store-offers
