name: Site Trust Footer Publish
on:
  push:
    branches: [main]
    paths:
      - 'assets/site-trust-footer.js'
      - '.github/workflows/site-trust-footer-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire shared footer asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets=[Path('index.html'),Path('_layouts/seo.html')]
          tag='<script src="/assets/site-trust-footer.js?v=20260904-3" defer></script>'
          for p in targets:
              if not p.exists():
                  continue
              s=p.read_text()
              import re
              s=re.sub(r'\n?<script src="/assets/site-trust-footer\.js\?v=[^"]+" defer></script>','',s)
              marker='</head>'
              if marker in s:
                  s=s.replace(marker,tag+'\n'+marker,1)
              elif '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html _layouts/seo.html
          git commit -m 'Trust: publish shared footer across main and SEO pages'
          git push