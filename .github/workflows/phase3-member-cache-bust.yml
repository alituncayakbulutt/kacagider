name: Phase 3 member asset publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-member-cache-bust.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump member asset parent version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='/assets/home-info-center-cta.js?v=20260904-1'
          new='/assets/home-info-center-cta.js?v=20260904-2'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('expected homepage asset reference not found')
          p.write_text(s)
          PY
      - name: Commit live reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Phase 3: publish member features live'
          git push