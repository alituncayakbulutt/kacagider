name: Home Information Center CTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-info-center-cta.yml'

permissions:
  contents: write

jobs:
  patch-home-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Attach Information Center CTA asset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/home-info-center-cta.js?v=20260903-1" defer></script>'
          if tag not in s:
              marker='<script src="/assets/analytics-events.js?v=20260901-live3" defer></script>'
              if marker not in s:
                  marker='<script src="/assets/analytics-events.js?v=20260903-live4" defer></script>'
              if marker not in s:
                  raise SystemExit('analytics script marker not found')
              s=s.replace(marker, marker+'\n'+tag, 1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F '/assets/home-info-center-cta.js?v=20260903-1' index.html
      - name: Commit homepage CTA loader
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Homepage CTA loader already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Ana sayfada Bilgi Merkezi butonunu yükle'
          git push origin HEAD:main
