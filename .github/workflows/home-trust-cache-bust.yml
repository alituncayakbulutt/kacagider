name: Homepage Trust Center Live

on:
  push:
    paths:
      - '.github/workflows/home-trust-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump homepage trust asset version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '/assets/home-info-center-cta.js?v=20260903-1'
          new = '/assets/home-info-center-cta.js?v=20260904-1'
          if old not in s and new not in s:
              raise SystemExit('Expected home-info-center-cta script tag not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/home-trust-cache-bust.yml
      - name: Commit live version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/home-trust-cache-bust.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Homepage: publish trust center live asset'
          git push origin main
