name: SEO CTR Audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-ctr-bulk.yml'
      - 'scripts/seo-site-audit.py'
      - 'scripts/seo-model-intent-audit.py'
      - 'scripts/seo-model-listing-intent-audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SEO site audit
        run: python3 scripts/seo-site-audit.py
      - name: Run model intent audit
        run: python3 scripts/seo-model-intent-audit.py
      - name: Run listing intent audit
        run: python3 scripts/seo-model-listing-intent-audit.py
      - name: Confirm workflow is read only
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            echo "SEO audit modified repository files; refusing mutation."
            git status --short
            exit 1
          fi
