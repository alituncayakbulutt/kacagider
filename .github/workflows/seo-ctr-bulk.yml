name: SEO CTR Bulk Update

on:
  push:
    paths:
      - 'scripts/update-seo-ctr.py'
      - 'scripts/apply-seo-priority-overrides.py'
      - 'scripts/add-breadcrumb-schema.py'
      - 'scripts/add-social-image-meta.py'
      - 'scripts/update-sitemap-lastmod.py'
      - '.github/workflows/seo-ctr-bulk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update device SEO and visible CTR signals
        run: python scripts/update-seo-ctr.py
      - name: Apply Search Console priority page overrides
        run: python scripts/apply-seo-priority-overrides.py
      - name: Add breadcrumb structured data
        run: python scripts/add-breadcrumb-schema.py
      - name: Add category share image metadata
        run: python scripts/add-social-image-meta.py
      - name: Sync sitemap lastmod from Git history
        run: python scripts/update-sitemap-lastmod.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No SEO changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telefon tablet bilgisayar akilli-saat oyun-konsolu telefonum-ne-kadar-eder telefonum-kac-para telefonum-kaca-gider _layouts/seo.html sitemap.xml
          git commit -m "SEO 3: expand priority CTR pages"
          git push
