name: SEO Phase 6 Cleanup

on:
  push:
    paths:
      - 'scripts/seo-phase6-cleanup.py'
      - '.github/workflows/seo-phase6-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Clean SEO descriptions
        run: python scripts/seo-phase6-cleanup.py
      - name: Commit cleaned metadata
        run: |
          if git diff --quiet; then
            echo "No metadata cleanup needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'bilgi-merkezi/index.md' 'bilgi-merkezi/**/index.md' 'rehber/index.md' 'rehber/**/index.md'
          git commit -m "SEO Phase 6: clean remaining metadata warnings"
          git push
