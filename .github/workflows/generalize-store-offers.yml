name: Generalize Store Offers

on:
  push:
    branches: [generalize-store-offers]
    paths:
      - 'scripts/apply-store-offers-generalization.py'
      - '.github/workflows/generalize-store-offers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: generalize-store-offers
          fetch-depth: 1
      - name: Apply patch
        run: python scripts/apply-store-offers-generalization.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/marketplace-sell-options-ui.js
          node --check assets/marketplace-sell-options-modal.js
          node --check assets/marketplace-dealer-backend.js
          node --check assets/marketplace-dealer-submit.js
          node --check assets/dealer-panel.js
          node --check assets/dealer-device-preferences.js
          node --check assets/marketplace-sell-options.js
          node --check assets/marketplace-test.js
      - name: Commit patched files and remove one-off tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-store-offers-generalization.py .github/workflows/generalize-store-offers.yml
          git add assets/marketplace-sell-options-ui.js assets/marketplace-sell-options-modal.js assets/marketplace-dealer-backend.js assets/marketplace-dealer-submit.js assets/dealer-panel.js assets/dealer-device-preferences.js assets/marketplace-sell-options.js assets/marketplace-test.js
          git commit -m "Generalize device offers to verified stores"
          git push origin HEAD:generalize-store-offers
