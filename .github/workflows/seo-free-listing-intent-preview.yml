name: SEO Free Listing Intent Preview

on:
  push:
    branches:
      - seo-free-listing-intent-preview
    paths:
      - 'scripts/expand-model-listing-intents.py'
      - 'scripts/seo-model-listing-intent-audit.py'
      - 'scripts/ensure-free-listing-seo-page.py'
      - 'ucretsiz-ilan-ver/index.md'
      - '.github/workflows/seo-free-listing-intent-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Expand model free-listing search intents without duplicates
        run: python scripts/expand-model-listing-intents.py

      - name: Ensure free-listing landing is in sitemap
        run: python scripts/ensure-free-listing-seo-page.py

      - name: Verify preview scope
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(telefon|tablet|bilgisayar|akilli-saat|oyun-konsolu)/[^/]+/[^/]+/index\.md$|^sitemap\.xml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected file(s) changed by free-listing SEO preview:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Audit free-listing intent coverage
        run: python scripts/seo-model-listing-intent-audit.py

      - name: Run existing SEO site audit read-only
        run: python scripts/seo-site-audit.py

      - name: Commit preview changes
        run: |
          if git diff --quiet; then
            echo "No free-listing SEO changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telefon tablet bilgisayar akilli-saat oyun-konsolu sitemap.xml
          git commit -m "SEO preview: add free listing intents to model pages"
          git push
