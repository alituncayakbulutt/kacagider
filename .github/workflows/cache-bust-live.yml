name: Cache Bust Live Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-live.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Version active assets in index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changes = {
              '<script src="/assets/analytics-events.js?v=20260901-live2" defer></script>': '<script src="/assets/analytics-events.js?v=20260901-live3" defer></script>',
          }
          changed = False
          for old, new in changes.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('Beklenen analytics asset satiri bulunamadi; index.html degistirilmedi.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify cache bust
        run: |
          grep -F '/assets/analytics-events.js?v=20260901-live3' index.html

      - name: Commit index only
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html zaten guncel.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Analytics asset surumunu yenile'
          git push origin HEAD:main
