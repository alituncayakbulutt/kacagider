name: Weekly Price Monitor (Dry Run)

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/weekly-price-monitor.py'
      - 'scripts/fetch-supabase-market-observations.py'
      - 'scripts/fetch-external-market-sources.py'
      - 'scripts/fetch-donanimhaber-market-source.py'
      - 'scripts/market-price-observation-engine.py'
      - 'config/weekly-price-monitor.json'
      - 'config/market-price-engine.json'
      - 'config/external-market-sources.json'
      - 'config/donanimhaber-market-source.json'
      - '.github/workflows/weekly-price-monitor.yml'
      - 'data/phone-prices.js'
      - 'data/price-history/**'
      - 'data/market-observations/**'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate pricing scripts
        run: |
          python -m py_compile scripts/weekly-price-monitor.py
          python -m py_compile scripts/fetch-supabase-market-observations.py
          python -m py_compile scripts/fetch-external-market-sources.py
          python -m py_compile scripts/fetch-donanimhaber-market-source.py
          python -m py_compile scripts/market-price-observation-engine.py

      - name: Run weekly catalog monitor
        run: python scripts/weekly-price-monitor.py

      - name: Fetch sanitized Supabase observations
        run: python scripts/fetch-supabase-market-observations.py

      - name: Fetch Phase 3 external market sources
        run: python scripts/fetch-external-market-sources.py

      - name: Fetch Phase 3B DonanimHaber peer source
        run: python scripts/fetch-donanimhaber-market-source.py

      - name: Run Phase 3 market observation engine
        run: python scripts/market-price-observation-engine.py

      - name: Safety check — protected live files unchanged
        run: |
          if ! git diff --quiet -- data/phone-prices.js index.html assets/; then
            echo 'ERROR: Dry-run attempted to change a protected live file.'
            git diff -- data/phone-prices.js index.html assets/
            exit 1
          fi
          echo 'Protected live files are unchanged.'

      - name: Add reports to job summary
        run: |
          cat reports/price-monitor/weekly-latest.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/price-monitor/external-sources-latest.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/price-monitor/donanimhaber-source-latest.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/price-monitor/market-candidates-latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run reports
        uses: actions/upload-artifact@v4
        with:
          name: weekly-price-monitor-${{ github.run_number }}
          path: |
            reports/price-monitor/weekly-latest.json
            reports/price-monitor/weekly-latest.md
            reports/price-monitor/external-sources-latest.json
            reports/price-monitor/external-sources-latest.md
            reports/price-monitor/donanimhaber-source-latest.json
            reports/price-monitor/donanimhaber-source-latest.md
            reports/price-monitor/market-candidates-latest.json
            reports/price-monitor/market-candidates-latest.md
          retention-days: 30
