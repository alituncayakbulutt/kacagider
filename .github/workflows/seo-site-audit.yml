name: SEO Reset Site Audit

on:
  push:
    branches: [main]
    paths:
      - "_layouts/seo.html"
      - "robots.txt"
      - "sitemap.xml"
      - "telefon/**"
      - "tablet/**"
      - "bilgisayar/**"
      - "akilli-saat/**"
      - "oyun-konsolu/**"
      - "scripts/seo-site-audit.py"
      - ".github/workflows/seo-site-audit.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run technical SEO audit
        run: python3 scripts/seo-site-audit.py
      - name: Confirm audit is read only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
