name: Phase 10 Growth

on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase10-growth-wire.py'
      - '.github/workflows/phase10-growth.yml'
      - 'assets/result-v2.js'
      - 'assets/account-dashboard.js'
      - 'index.html'
      - 'hesabim/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  growth-wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Phase 10 growth UI wiring
        run: python scripts/phase10-growth-wire.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/result-v2.js
          node --check assets/account-dashboard.js
      - name: Preserve security quality gate
        run: python scripts/security-audit.py
      - name: Preserve performance quality gate
        run: python scripts/performance-audit.py
      - name: Preserve Mobile V3 quality gate
        run: python scripts/mobile-v3-audit.py
      - name: Preserve SEO quality gate
        run: python scripts/seo-site-audit.py
      - name: Commit Phase 10 wiring
        run: |
          if git diff --quiet; then
            echo "Phase 10 growth wiring already applied and validated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/result-v2.js assets/account-dashboard.js index.html hesabim/index.html
          git commit -m "Phase 10: wire configurable price alerts"
          git push
