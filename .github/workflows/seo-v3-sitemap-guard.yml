name: SEO Reset Sitemap Audit

on:
  push:
    branches: [main]
    paths:
      - "sitemap.xml"
      - "robots.txt"
      - "_redirects"
      - "scripts/generate-seo-static-pages.mjs"
      - "data/seo-v4-policy.json"
      - "ucretsiz-ilan-ver/index.md"
      - "bilgi-merkezi/**"
      - "sitemap-bilgi.xml"
      - "telefon/**"
      - "tablet/**"
      - "bilgisayar/**"
      - "akilli-saat/**"
      - "oyun-konsolu/**"
      - "scripts/update-sitemap-lastmod.py"
      - ".github/workflows/seo-v3-sitemap-guard.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sitemap without mutating repository
        run: |
          python3 scripts/update-sitemap-lastmod.py
          git diff --exit-code -- sitemap.xml
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          root=ET.parse("sitemap.xml").getroot()
          ns={"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls=[n.text.strip() for n in root.findall("s:url/s:loc",ns) if n.text]
          if len(urls)!=len(set(urls)): raise SystemExit("Duplicate sitemap URL")
          variant=re.compile(r"^\\d+(?:gb|tb|mm)$",re.I)
          leaked=[]
          for url in urls:
            parts=[p for p in urlparse(url).path.split("/") if p]
            if len(parts)==4 and parts[0] in {"telefon","tablet","bilgisayar","akilli-saat","oyun-konsolu"} and variant.fullmatch(parts[-1]): leaked.append(url)
          if leaked: raise SystemExit(f"Variant URLs in sitemap: {leaked[:10]}")
          print(f"SEO RESET SITEMAP PASS: {len(urls)} unique canonical URLs")
          PY
      - name: Validate Sitemap and Indexing SEO V11
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          ns={"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          def urls(path):
              root=ET.parse(path).getroot()
              return [n.text.strip() for n in root.findall("s:url/s:loc",ns) if n.text]
          primary=urls("sitemap.xml")
          info=urls("sitemap-bilgi.xml")
          overlap=sorted(set(primary)&set(info))
          if overlap: raise SystemExit(f"URLs submitted in both sitemaps: {overlap[:10]}")
          if any("/bilgi-merkezi/" in url for url in primary):
              raise SystemExit("Bilgi Merkezi URL leaked into primary sitemap")
          if any("/bilgi-merkezi/" not in url for url in info):
              raise SystemExit("Non-Bilgi Merkezi URL leaked into sitemap-bilgi")
          redirects={}
          for line in Path("_redirects").read_text().splitlines():
              line=line.strip()
              if not line or line.startswith("#"): continue
              parts=line.split()
              if len(parts)==3 and parts[2]=="301": redirects.add("https://kacagider.com.tr"+parts[0])
          leaked=sorted((set(primary)|set(info))&redirects)
          if leaked: raise SystemExit(f"Redirect source submitted in sitemap: {leaked[:10]}")
          robots=Path("robots.txt").read_text()
          for name in ("sitemap.xml","sitemap-bilgi.xml"):
              if f"Sitemap: https://kacagider.com.tr/{name}" not in robots:
                  raise SystemExit(f"robots.txt missing {name}")
          print(f"SITEMAP SEO V11 PASS: primary={len(primary)}, information={len(info)}, overlap=0, redirect_sources=0")
          PY
      - name: Validate Internal Linking SEO V10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          model=Path("telefon/apple/iphone-13/index.md").read_text()
          required=[
            "/telefon/apple/",
            "/telefonum-ne-kadar-eder/",
            "/bilgi-merkezi/degerleme/telefon-degeri-nasil-hesaplanir/",
            "/bilgi-merkezi/satis-oncesi/telefon-satmadan-once/",
            "/ucretsiz-ilan-ver/"
          ]
          missing=[url for url in required if url not in model]
          if missing: raise SystemExit(f"Internal linking V10 sample missing: {missing}")
          generator=Path("scripts/generate-seo-static-pages.mjs").read_text()
          for url in required[1:]:
            if url not in generator: raise SystemExit(f"Internal linking V10 generator missing: {url}")
          variant=re.compile(r'/\\d+(?:gb|tb|mm)/',re.I)
          generated_block=generator[generator.index("function modelSeoMeta"):generator.index("function landingMeta")]
          # Generator may filter legacy input links, but must never define a variant URL as a required link.
          for line in generated_block.splitlines():
            if "label:" in line and "url:" in line and variant.search(line):
              raise SystemExit(f"Variant target hardcoded in model linking: {line.strip()}")
          print("INTERNAL LINKING SEO V10 PASS: owner flow and variant exclusion present")
          PY
      - name: Validate Information Center SEO V9 ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required={
            "bilgi-merkezi/satis-oncesi/telefon-satmadan-once/index.md":"Telefon Satmadan Önce Yapılması Gerekenler",
            "bilgi-merkezi/satis-oncesi/ikinci-el-telefon-satarken/index.md":"İkinci El Telefon Satarken Dikkat Edilmesi Gerekenler",
            "bilgi-merkezi/satis-oncesi/imei-sorgulama/index.md":"IMEI Sorgulama Nasıl Yapılır?",
            "bilgi-merkezi/ikinci-el/ikinci-el-telefon-alirken/index.md":"İkinci El Telefon Alırken Nelere Dikkat Edilmeli?",
            "bilgi-merkezi/degerleme/telefon-degeri-nasil-hesaplanir/index.md":"Telefon Değerini Etkileyen Faktörler"
          }
          for path,needle in required.items():
            text=Path(path).read_text()
            if needle not in text: raise SystemExit(f"Information Center V9 owner missing: {path} -> {needle}")
          redirects=Path("_redirects").read_text()
          imei="/rehber/telefon/imei-sorgulama/ /bilgi-merkezi/satis-oncesi/imei-sorgulama/ 301"
          if imei not in redirects: raise SystemExit("Legacy IMEI duplicate is not consolidated")
          sitemap=Path("sitemap-bilgi.xml").read_text()
          for path in required:
            url="https://kacagider.com.tr/"+path.removesuffix("index.md")
            if f"<loc>{url}</loc>" not in sitemap: raise SystemExit(f"Information guide missing from sitemap-bilgi: {url}")
          print("INFORMATION CENTER SEO V9 PASS: priority intents, consolidation and sitemap present")
          PY
      - name: Validate free listing SEO V8 ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path("ucretsiz-ilan-ver/index.md").read_text()
          required=[
            'seo_page_type: "free_listing"',
            'seo_h1: "Ücretsiz İlan Ver"',
            'İkinci El Telefon Sat',
            'Telefon Sat Fiyat Al',
            'https://kacagider.com.tr/ucretsiz-ilan-ver/',
            '/telefonum-ne-kadar-eder/'
          ]
          missing=[item for item in required if item not in page]
          if missing: raise SystemExit(f"Free listing SEO V8 ownership missing: {missing}")
          if 'satın alma teklifi veya satış garantisi değildir' not in page:
            raise SystemExit("Free listing page must distinguish valuation from a purchase offer")
          print("FREE LISTING SEO V8 PASS: listing/sale intent owner and valuation boundary present")
          PY
      - name: Validate model SEO V7 generator rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path("scripts/generate-seo-static-pages.mjs").read_text()
          required=[
            'seo_page_type:"model"',
            'Ne Kadar Eder? İkinci El Fiyatı | KaçaGider',
            'İkinci El Fiyatı',
            'Piyasa Değeri',
            'Değeri Nasıl Hesaplanır?',
            'cleanLinks=(links||[]).filter',
            'categoryLandingConfig[kind].url'
          ]
          missing=[item for item in required if item not in source]
          if missing: raise SystemExit(f"Model SEO V7 generator rule missing: {missing}")
          print("MODEL SEO V7 PASS: single-canonical intent template and variant-link filtering present")
          PY
      - name: Validate legacy variant redirects
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          variant=re.compile(r"/(?:\d+(?:gb|tb|mm))/$",re.I)
          lines=[line.strip() for line in Path("_redirects").read_text().splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines)>2000: raise SystemExit(f"Too many static redirects for Pages: {len(lines)}")
          sources=set()
          for line in lines:
            parts=line.split()
            if len(parts)!=3 or parts[2]!="301": raise SystemExit(f"Invalid redirect rule: {line}")
            source,target,_=parts
            if source in sources: raise SystemExit(f"Duplicate redirect source: {source}")
            sources.add(source)
            if source==target: raise SystemExit(f"Self redirect: {source}")
            if not variant.search(source) and source != "/rehber/telefon/imei-sorgulama/": raise SystemExit(f"Unexpected redirect source: {source}")
            if variant.search(target): raise SystemExit(f"Redirect chain risk: {line}")
          print(f"SEO REDIRECT PASS: {len(lines)} unique permanent variant redirects")
          PY
