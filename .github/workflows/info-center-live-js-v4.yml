name: Information Center Live JS V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/info-center-live-js-v4.yml'

permissions:
  contents: write

jobs:
  bump-live-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Force fresh Information Center JS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('_layouts/seo.html')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'/assets/info-center\.js\?v=[^"\']+', '/assets/info-center.js?v=20260903-4', s)
          if s2==s:
              raise SystemExit('info-center.js versioned script tag not found')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -F '/assets/info-center.js?v=20260903-4' _layouts/seo.html
      - name: Commit fresh JS version
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _layouts/seo.html
          if git diff --cached --quiet; then
            echo 'Already current.'
            exit 0
          fi
          git commit -m 'Bilgi Merkezi destek JS cache sürümünü yenile'
          git push origin HEAD:main
