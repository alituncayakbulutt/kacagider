name: Result V2 Live

on:
  push:
    paths:
      - '.github/workflows/result-v2-live.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Result V2 asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/result-v2.js?v=20260904-1" defer></script>'
          if tag not in s:
              anchor='<script src="/assets/home-info-center-cta.js?v=20260904-1" defer></script>'
              if anchor in s:
                  s=s.replace(anchor, anchor+'\n'+tag, 1)
              else:
                  s=s.replace('</head>', tag+'\n</head>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit live integration
        run: |
          if git diff --quiet -- index.html; then
            echo "Result V2 asset already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "FAZ 2: connect result V2 on homepage"
          git push origin main
