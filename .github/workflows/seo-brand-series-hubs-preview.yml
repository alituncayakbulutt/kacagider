name: SEO Brand and Series Hubs Preview

on:
  push:
    branches:
      - seo-brand-series-hubs-preview
    paths:
      - 'scripts/expand-brand-series-hubs.py'
      - 'scripts/seo-brand-series-hub-audit.py'
      - 'scripts/write-brand-series-preview-report.py'
      - 'scripts/harden-brand-series-generator.py'
      - 'scripts/harden-model-seo-for-series-hubs.py'
      - 'scripts/sanitize-brand-series-visible-copy.py'
      - '.github/workflows/seo-brand-series-hubs-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Harden SEO3 series matching and naming
        run: python scripts/harden-brand-series-generator.py

      - name: Compile SEO3 tooling
        run: |
          python -m py_compile scripts/expand-brand-series-hubs.py scripts/seo-brand-series-hub-audit.py scripts/write-brand-series-preview-report.py scripts/harden-brand-series-generator.py scripts/harden-model-seo-for-series-hubs.py scripts/sanitize-brand-series-visible-copy.py
          find scripts -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Harden legacy model SEO tooling for series pages
        run: python scripts/harden-model-seo-for-series-hubs.py

      - name: Enrich existing brand hubs and generate qualified series hubs
        run: python scripts/expand-brand-series-hubs.py

      - name: Keep visible brand-series copy evergreen
        run: python scripts/sanitize-brand-series-visible-copy.py

      - name: Write preview coverage report
        run: python scripts/write-brand-series-preview-report.py

      - name: Verify generated scope
        run: |
          changed="$(git status --porcelain=v1 -uall | cut -c4-)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(telefon|tablet|bilgisayar|akilli-saat|oyun-konsolu)/[^/]+/index\.md$|^(telefon|tablet|bilgisayar|akilli-saat|oyun-konsolu)/[^/]+/[^/]+/index\.md$|^sitemap\.xml$|^SEO_BRAND_SERIES_HUBS_PREVIEW\.md$|^scripts/expand-brand-series-hubs\.py$|^scripts/expand-model-query-intents\.py$|^scripts/seo-model-intent-audit\.py$|^scripts/expand-model-listing-intents\.py$|^scripts/seo-model-listing-intent-audit\.py$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected file(s) changed by brand-series SEO preview:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Audit brand and series hubs
        run: python scripts/seo-brand-series-hub-audit.py

      - name: Re-audit existing model price-intent program
        run: python scripts/seo-model-intent-audit.py

      - name: Re-audit existing model free-listing program
        run: python scripts/seo-model-listing-intent-audit.py

      - name: Run existing SEO site audit read-only
        run: python scripts/seo-site-audit.py

      - name: Commit preview changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No brand-series SEO changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telefon tablet bilgisayar akilli-saat oyun-konsolu sitemap.xml SEO_BRAND_SERIES_HUBS_PREVIEW.md scripts/expand-brand-series-hubs.py scripts/expand-model-query-intents.py scripts/seo-model-intent-audit.py scripts/expand-model-listing-intents.py scripts/seo-model-listing-intent-audit.py
          git commit -m "SEO preview: refine brand and series hubs"
          git push
