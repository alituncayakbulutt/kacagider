name: One-shot GA4 instrumentation patch

on:
  push:
    branches:
      - analytics/ga4-events

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics/ga4-events

      - name: Inject analytics event script
        shell: python
        run: |
          from pathlib import Path

          needle = '<script src="data/phone-prices.js"></script>'
          injection = needle + '\n<script src="/assets/analytics-events.js" defer></script>'

          for name in ('index.html', '_layouts/seo.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if '/assets/analytics-events.js' not in text:
                  if needle not in text:
                      raise SystemExit(f'Injection point not found in {name}')
                  text = text.replace(needle, injection, 1)
                  path.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/ga4-instrumentation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _layouts/seo.html .github/workflows/ga4-instrumentation-patch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire GA4 custom event tracking"
          git push origin HEAD:analytics/ga4-events
